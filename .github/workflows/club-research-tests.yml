name: Club research tests
on:
  pull_request:
    paths:
      - 'club_research.py'
      - 'global_source_router.py'
      - 'live_official_evidence.py'
      - 'official_match_extractor.py'
      - 'test_official_match_extractor.py'
      - 'test_live_official_evidence.py'
      - 'test_global_source_router.py'
      - 'research_sources.py'
      - 'test_club_research.py'
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/club-research-tests.yml'
  push:
    branches: [feat/verified-club-research]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install fastapi 'pydantic>=2' requests beautifulsoup4 pytest
      - run: python -m compileall -q club_research.py research_sources.py global_source_router.py live_official_evidence.py official_match_extractor.py test_club_research.py test_global_source_router.py test_live_official_evidence.py test_official_match_extractor.py
      - run: python -m pytest -q test_club_research.py test_global_source_router.py test_live_official_evidence.py test_official_match_extractor.py
